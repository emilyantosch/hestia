<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; media-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
  html, body { margin: 0; height: 100%; background: #171a15; color: #f5f0e7; font: 14px system-ui; }
  video { width: 100%; height: 100%; object-fit: contain; }
  #error { position: absolute; inset: 0; padding: 24px; }
</style>
<video src="video" controls playsinline preload="metadata" aria-label="Video preview"></video>
<p id="error" role="alert" hidden>Could not play this video. The file may be unreadable, or its codec is not supported by your system.</p>
<script>
  const video = document.querySelector('video');
  video.addEventListener('error', () => {
    document.querySelector('#error').hidden = false;
  });
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape') {
      event.preventDefault();
      video.pause();
      window.ipc.postMessage('close');
    }
  });
</script>
